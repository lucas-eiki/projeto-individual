    <main class="main-animacoes">

                    <li>
                        <a target="_blank" href="https://www.linkedin.com/in/lucaseikigushiken/">
                            <img src="../assets/images/icons/linkedin-icon.png" alt="logo do linkedin">
                        </a>
                    </li>
                    <li>
                        <a target="_blank" href="https://github.com/lucas-eiki">
                            <img src="../assets/images/icons/github-icon.png" alt="logo do github">
                        </a>
                    </li>
                </ul>
                <div class="email-container">

                    <p>lucas.gushiken@sptech.school</p>

</html>

<script>
    let ul_lista_animacoes = document.getElementById('lista-animacoes')

    function exibirAnimacoes() {
        fetch('/animacoes/listar').then(function (resposta) {
            if (resposta.ok) {

                if (resposta.status == 204) {
                    ul_lista_animacoes.innerHTML = '<li>Nenhuma animação encontrada</li>'
                    throw "Nenhum resultado encontrado!!";
                }

                console.log(resposta)

                resposta.json().then(resposta => {
                    for (let i = 0; i < resposta.length; i++) {
                        let animacao = resposta[i]
                        let imagem = animacao.imagem == null ? 'https://placehold.co/312x468?text=Imagem+não+encontrada' : animacao.imagem

                        ul_lista_animacoes.innerHTML += `
                            <li class="animacao">
                                <button class="animacao-container" onclick="verAnimacao(${animacao.id})">
                                    <img src="${imagem}" alt="Imagem da animação ${animacao.titulo}">
                                    <h2>${animacao.titulo}</h2>
                                </button>
                            </li>
                        `
                    }
                })
            }
            else {
                throw ('Houve um erro na API!');
            }
        }).catch(function (resposta) {
            console.error(resposta)
        })
    }

    function verAnimacao(id_animacao) {
        sessionStorage.ID_ANIMACAO = id_animacao

        window.location = "./animacao.html"
    }
</script>
