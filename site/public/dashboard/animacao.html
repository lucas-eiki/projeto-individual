<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animotion</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/dashboard.css">

    <script src="../js/sessao.js"></script>
</head>

<body onload="validarSessao(), exibirAnimacao(), buscarAvaliacao()">
    <header>
        <img class="logo-animotion" src="../assets/images/animotion-logo.png" alt="logo animotion">

        <nav>
            <ul class="links">
                <li><a href="./animacoes.html">Animações</a></li>
                <li><a href="./estatisticas.html">Estatísticas</a></li>
            </ul>
            <div class="perfil-container">
                <button onclick="toggleLinksPerfil()" class="btn-perfil-container">
                    <img id="imagem-perfil" src="" alt="imagem de perfil">
                    <div class="perfil-info-container">
                        <span id="apelido-usuario">Apelido</span>
                        <span id="email-usuario">E-mail</span>
                    </div>
                </button>
                <div id="div-perfil-links" class="perfil-links-container">
                    <a class="perfil-button perfil-link" href="./perfil.html">Perfil</a>
                    <button onclick="finalizarSessao()" class="sair-button perfil-link">Sair</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-animacao">
        <a href="./animacoes.html">Voltar</a>
        <div id="animacao-container"></div>
        <div id="avaliacoes-container">
            <div class="avaliacoes-container-info">
                <h2>Avaliações</h2>
                <button id="btn-avalie" class="btn-avalie" onclick="mostrarAvaliar()">Avalie</button>
                <div id="avaliar" class="avaliar">
                    <div class="notas-container">
                        <label onclick="atualizarEstrelas()" for="estrela1"><img id="img-estrela1" class="estrela"
                                src="../assets/images/icons/estrela-cinza.png" alt="estrela 1"></label>
                        <input value="1" name="estrela" type="radio" id="estrela1">

                        <label onclick="atualizarEstrelas()" for="estrela2"><img id="img-estrela2" class="estrela"
                                src="../assets/images/icons/estrela-cinza.png" alt="estrela 2"></label>
                        <input value="2" name="estrela" type="radio" id="estrela2">

                        <label onclick="atualizarEstrelas()" for="estrela3"><img id="img-estrela3" class="estrela"
                                src="../assets/images/icons/estrela-cinza.png" alt="estrela 3"></label>
                        <input value="3" name="estrela" type="radio" id="estrela3">

                        <label onclick="atualizarEstrelas()" for="estrela4"><img id="img-estrela4" class="estrela"
                                src="../assets/images/icons/estrela-cinza.png" alt="estrela 4"></label>
                        <input value="4" name="estrela" type="radio" id="estrela4">

                        <label onclick="atualizarEstrelas()" for="estrela5"><img id="img-estrela5" class="estrela"
                                src="../assets/images/icons/estrela-cinza.png" alt="estrela 5"></label>
                        <input value="5" name="estrela" type="radio" id="estrela5">
                    </div>
                    <textarea name="comentario-avaliacao" id="comentario-avaliacao" maxlength="1000"
                        placeholder="Comentário"></textarea>
                    <div class="buttons-container">
                        <button class="btn-cancelar" onclick="cancelarAvaliacao()">Cancelar</button>
                        <button onclick="enviarAvaliacao()">Enviar</button>
                    </div>
                </div>
                <div id="avaliacao-propria"></div>
                <ul id="lista-comentarios"></ul>
            </div>
            <div class="grafico-avaliacoes">
                <canvas id="grafico-avaliacoes"></canvas>
            </div>
        </div>
    </main>

    <footer>
        <img class="logo-animotion" src="../assets/images/animotion-logo.png" alt="logo animotion">
        <p>Feito com carinho por Lucas Eiki Gushiken</p>
        <div class="contatos">
            <h3>Contatos</h3>
            <div class="contatos-container">
                <ul class="redes-sociais">
                    <li>
                        <a target="_blank" href="https://www.linkedin.com/in/lucaseikigushiken/">
                            <img src="../assets/images/icons/linkedin-icon.png" alt="logo do linkedin">
                        </a>
                    </li>
                    <li>
                        <a target="_blank" href="https://github.com/lucas-eiki">
                            <img src="../assets/images/icons/github-icon.png" alt="logo do github">
                        </a>
                    </li>
                </ul>
                <div class="email-container">
                    <h4>E-mail:</h4>
                    <p>lucas.gushiken@sptech.school</p>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>

<script>
    const animacaoContainer = document.getElementById('animacao-container');
    let ul_lista_comentarios = document.getElementById('lista-comentarios')

    function exibirAnimacao() {

        fetch(`/animacoes/buscar/${sessionStorage.getItem("ID_ANIMACAO")}`).then(function (resposta) {
            if (resposta.ok) {

                if (resposta.status == 204) {
                    animacaoContainer.innerHTML = `
                        <h1>Nenhuma animação encontrada...</h1>
                    `
                    throw "Nenhum resultado encontrado!!";
                }

                console.log(resposta)

                resposta.json().then(resposta => {
                    let animacao = resposta[0]

                    animacaoContainer.innerHTML = `
                        <div class="animacao-info-container">
                            <div class="titulo-container">
                                <h1>${animacao.titulo}</h1>
                                <ul class="detalhes">
                                    <li class="ano-lancamento">${animacao.ano_lancamento}</li>
                                    <li class="classificacao-indicativa"><img class="img-classificacao-indicativa" src="../assets/images/classificacao-indicativa/${animacao.classificacao}.png" alt="classificação indicativa"></li>
                                    <li class="categoria">${(animacao.categoria == null ? 'Sem categoria' : animacao.categoria)}</li>
                                </ul>
                            </div>
                            <ul id="generos-container">
                                <li>genero</li>
                            </ul>
                            <div class="avaliacao-container">
                                <div class="nota-container">
                                    <img src="../assets/images/icons/estrela.png" alt="ícone de estrela">
                                    <p class="p-nota"><span id="media_nota">${(animacao.media_nota == null ? '0' : Number(animacao.media_nota).toFixed(1) * 1)}</span>/5</p>
                                </div>
                                <p class="p-numero-avaliacoes">(<span id="numero-avaliacoes">${animacao.qtd_avaliacoes}</span> avaliações)</p>
                            </div>
                            <p class="sinopse">${animacao.sinopse}</p>
                        </div>

                    
                        <img class="imagem-animacao" src="${animacao.imagem}" alt="Imagem da animação">
                    `
                })
            }
            else {
                throw ('Houve um erro na API!');
            }
        }).catch(function (resposta) {
            console.error(resposta)
        })

        fetch(`/avaliacoes/listar/${sessionStorage.getItem("ID_ANIMACAO")}`).then(function (resposta) {
            if (resposta.ok) {

                if (resposta.status == 204) {
                    ul_lista_comentarios.innerHTML = `
                        <p>Nenhuma avaliação encontrada...</p>
                    `
                    throw "Nenhum resultado encontrado!!";
                }

                console.log(resposta)

                resposta.json().then(avaliacoes => {

                    let indexAtual = 0;
                    let numeroAvaliacoes = avaliacoes.length;

                    while (indexAtual < numeroAvaliacoes) {
                        let avaliacao = avaliacoes[indexAtual]
                        if (avaliacao.comentario != null && avaliacao.id_usuario != sessionStorage.getItem('ID_USUARIO')) {

                            let estrelas = ''
                            for (let i = 0; i < 5; i++) {
                                if (avaliacao.nota > i) {
                                    estrelas += '<img class="img-estrela" src="../assets/images/icons/estrela.png" alt="estrela amarela">'
                                } else {
                                    estrelas += '<img class="img-estrela" src="../assets/images/icons/estrela-cinza.png" alt="estrela cinza">'
                                }
                            }

                            ul_lista_comentarios.innerHTML += `
                                <li class="li-avaliacao-container">
                                    <img class="imagem-perfil" src="${(avaliacao.imagem_perfil == null ? '../assets/avatar/avatar-generico.jpg' : avaliacao.imagem_perfil)}" alt="imagem de perfil">
                                    <div class="comentario-container">
                                        <div class="comentario-info">
                                            <div class="avaliacao-info">
                                                <div class="qtd-estrelas">${estrelas}</div>
                                                <div class="data-avaliacao">${avaliacao.data_avaliacao}</div>
                                            </div>
                                            <span class="nome-usuario">${avaliacao.apelido == null ? avaliacao.nome : avaliacao.apelido}</span>
                                        </div>
                                        <p class="comentario">${avaliacao.comentario}</p>
                                    </div> 
                                </li>
                            `
                        }
                        indexAtual++
                    }
                    setTimeout(() => {
                        if (ul_lista_comentarios.innerHTML == '' && document.getElementById('avaliacao-propria').innerHTML == '') {
                        ul_lista_comentarios.innerHTML = '<p>Nenhum comentário ainda...</p>'
                    }
                    }, 100)
                })
            }
            else {
                throw ('Houve um erro na API!');
            }
        }).catch(function (resposta) {
            console.error(resposta)
        })
    }

    let nota = 0

    function atualizarEstrelas() {
        let estrelasSelecionadas
        setTimeout(() => {
            estrelasSelecionadas = document.querySelector('input:checked').value
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`img-estrela${i}`).src = '../assets/images/icons/estrela-cinza.png'
            }
            for (let i = 1; i <= estrelasSelecionadas; i++) {
                document.getElementById(`img-estrela${i}`).src = '../assets/images/icons/estrela.png'
            }
            nota = estrelasSelecionadas
        }, 1)
    }

    function mostrarAvaliar() {
        document.getElementById('avaliar').classList.add('aberto')
        document.getElementById('btn-avalie').classList.remove('aberto')
    }

    function cancelarAvaliacao() {
        document.getElementById('avaliar').classList.remove('aberto')
        document.getElementById('btn-avalie').classList.add('aberto')
    }

    function enviarAvaliacao() {
        document.getElementById('avaliar').classList.remove('aberto')

        const dataAtual = new Date()

        let dataBrasil = dataAtual.toLocaleDateString('pt-br')

        const [dia, mes, ano] = dataBrasil.split('/');
        const dataFormatada = `${ano}-${mes}-${dia}`;

        var corpo = {
            nota: nota,
            comentario: document.getElementById('comentario-avaliacao').value,
            data_avaliacao: dataFormatada
        }

        fetch(`/avaliacoes/enviar/${sessionStorage.getItem('ID_ANIMACAO')}/usuario/${sessionStorage.getItem('ID_USUARIO')}`, {
            method: "post",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(corpo)
        }).then(function (resposta) {

            console.log("resposta: ", resposta);

            if (resposta.ok) {
                window.alert("Post realizado com sucesso pelo usuario de ID: " + sessionStorage.getItem('ID_USUARIO') + "!");
            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
        });
    }

    function buscarAvaliacao() {
        fetch(`/avaliacoes/buscar/${sessionStorage.getItem("ID_ANIMACAO")}/usuario/${sessionStorage.getItem('ID_USUARIO')}`).then(function (resposta) {
            if (resposta.ok) {

                if (resposta.status == 204) {
                    document.getElementById('btn-avalie').classList.add('aberto')

                    throw "Nenhum resultado encontrado!!";
                } else {
                    document.getElementById('btn-avalie').classList.remove('aberto')

                    resposta.json().then(avaliacoes => {
                        let avaliacao = avaliacoes[0]

                        console.log(avaliacao);
                        let estrelas = ''
                        for (let i = 0; i < 5; i++) {
                            if (avaliacao.nota > i) {
                                estrelas += '<img class="img-estrela" src="../assets/images/icons/estrela.png" alt="estrela amarela">'
                            } else {
                                estrelas += '<img class="img-estrela" src="../assets/images/icons/estrela-cinza.png" alt="estrela cinza">'
                            }
                        }

                        document.getElementById('avaliacao-propria').innerHTML = `
                            <img class="imagem-perfil" src="${(avaliacao.imagem_perfil == null ? '../assets/avatar/avatar-generico.jpg' : avaliacao.imagem_perfil)}" alt="imagem de perfil">
                            <div class="comentario-container">
                                <div class="comentario-info">
                                    <div class="avaliacao-info">
                                        <div class="qtd-estrelas">${estrelas}</div>
                                        <div class="data-avaliacao">${avaliacao.data_avaliacao}</div>
                                    </div>
                                    <span class="nome-usuario">${avaliacao.apelido == null ? avaliacao.nome : avaliacao.apelido}</span>
                                </div>
                            ${avaliacao.comentario == null ? '' : `<p class="comentario">${avaliacao.comentario}</p>`}
                            </div> 
                        `
                    })
                }
            }
        }).catch(function (resposta) {
            console.error(resposta)
        })
    }
</script>
