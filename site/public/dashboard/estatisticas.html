<script>
    function buscarMelhorAnimacao() {


        fetch('/animacoes/buscar-top-1/').then(resposta => {

            if (resposta.ok) {

                resposta.json().then(array => {
                    let animacao = array[0]

                    document.getElementById('main-estatistica').innerHTML += `
                        <div class="melhor-animacao-container">
                            <div class="melhor-animacao">
                                <img src="${animacao.imagem}" alt="imagem da animacao">
                                <div class="melhor-animacao-info">
                                    <div class="media-nota">${Number(animacao.media).toFixed(2) * 1}/5</div>
                                    <div class="numero-avaliacoes">${animacao.numero_avaliacoes} avaliações</div>
                                    <div class="ano-lancamento">${animacao.ano_lancamento}</div>
                                    <div class="numero-comentarios">${animacao.numero_comentarios} comentários</div>
                                </div>
                            </div>
                            <div class="info-gerais-container">
                                <div class="kpis-animacoes-geral">
                                    <div class="media-geral-container">
                                        <h2>Média geral</h2>
                                        <span class="media-geral">${animacao.media_geral}</span>
                                    </div>
                                    <div class="numero-comentarios-geral-container">
                                        <h2>Nº comentários total</h2>
                                        <span class="numero-comentarios-total">${animacao.numero_comentarios_total}</span>
                                    </div>
                                </div>
                                <div class="graficos-proporcao">
                                    <div class="proporcao-avaliacoes-container">
                                        <canvas id="proporcao-avaliacoes"></canvas>
                                    </div>
                                    <div class="proporcao-comentarios-container">
                                        <canvas id="proporcao-comentarios"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="ranking-container">
                            <div class="ranking-avaliacoes-container">
                                <canvas id="ranking-avaliacoes"></canvas>
                            </div>
                            <div class="ranking-comentarios-container">
                                <canvas id="ranking-comentarios"></canvas>
                            </div>
                        </div>
                    `

                    let porcentagemNumeroAvaliacoes = (animacao.numero_avaliacoes / animacao.numero_avaliacoes_total * 100).toFixed(2) * 1
                    let restoPorcentagem = 100 - porcentagemNumeroAvaliacoes

                    let dadosProporcaoAvaliacoes = {
                        labels: [`${animacao.titulo}`, 'Resto'],
                        data: [porcentagemNumeroAvaliacoes, restoPorcentagem]
                    }
                    
                    plotarGraficoProporcaoAvaliacoes(dadosProporcaoAvaliacoes)
                })
            } else {
                console.log('Erro na busca de melhor animação');
                throw 'Erro na busca de melhor animação'
            }
        }).catch(resposta => {
            console.log(resposta);
        })
    }

    function plotarGraficoProporcaoAvaliacoes(dados) {
        let data = {
            labels: dados.labels,
            datasets: [{
                label: 'Proporção de avaliações',
                data: dados.data,
                borderWidth: 1,
                backgroundColor: '#EAAB39',
                borderRadius: 8
            }]
        }

        // let options = {
        //     scales: {
        //         y: {
        //             beginAtZero: true
        //         }
        //     },
        //     indexAxis: 'y'
        // }

        let config = {
            type: 'pie',
            data
            // options
        }

        let myChart = new Chart(
            document.getElementById('proporcao-avaliacoes'),
            config
        );
    }
</script>
