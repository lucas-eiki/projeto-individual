<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animotion</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/dashboard.css">

    <script src="../js/sessao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="validarSessao(), buscarMelhorAnimacao()">
    <header>
        <img class="logo-animotion" src="../assets/images/animotion-logo.png" alt="logo animotion">

        <nav>
            <ul class="links">
                <li><a href="./animacoes.html">Animações</a></li>
                <li><a class="selecionado" href="./estatisticas.html">Estatísticas</a></li>
            </ul>
            <div class="perfil-container">
                <button onclick="toggleLinksPerfil()" class="btn-perfil-container">
                    <img id="imagem-perfil" src="" alt="imagem de perfil">
                    <div class="perfil-info-container">
                        <span id="apelido-usuario">Apelido</span>
                        <span id="email-usuario">E-mail</span>
                    </div>
                </button>
                <div id="div-perfil-links" class="perfil-links-container">
                    <a class="perfil-button perfil-link" href="./perfil.html">Perfil</a>
                    <button onclick="finalizarSessao()" class="sair-button perfil-link">Sair</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-estatistica" id="main-estatistica"></main>

    <footer>
        <img class="logo-animotion" src="../assets/images/animotion-logo.png" alt="logo animotion">
        <p>Feito com carinho por Lucas Eiki Gushiken</p>
        <div class="contatos">
            <h3>Contatos</h3>
            <div class="contatos-container">
                <ul class="redes-sociais">
                    <li>
                        <a target="_blank" href="https://www.linkedin.com/in/lucaseikigushiken/">
                            <img src="../assets/images/icons/linkedin-icon.png" alt="logo do linkedin">
                        </a>
                    </li>
                    <li>
                        <a target="_blank" href="https://github.com/lucas-eiki">
                            <img src="../assets/images/icons/github-icon.png" alt="logo do github">
                        </a>
                    </li>
                </ul>
                <div class="email-container">
                    <h4>E-mail:</h4>
                    <p>lucas.gushiken@sptech.school</p>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>

<script>
    function buscarMelhorAnimacao() {


        fetch('/animacoes/buscar-top-1/').then(resposta => {

            if (resposta.ok) {

                resposta.json().then(array => {
                    let animacao = array[0]
                    let imagem = animacao.imagem == null ? 'https://placehold.co/312x468?text=Imagem+não+encontrada' : animacao.imagem

                    document.getElementById('main-estatistica').innerHTML += `
                        <h1>Melhor animação do momento</h1>
                        <div class="melhor-animacao-container">
                            <div class="melhor-animacao">
                                <img class="img-melhor-animacao" src="${imagem}" alt="imagem da animacao">
                                <div class="melhor-animacao-info">
                                    <h2>${animacao.titulo}</h2>
                                    <div class="media-container">
                                        <h3>Nota média</h3>
                                        <span class="media-nota">${Number(animacao.media).toFixed(2) * 1}/5</span>
                                    </div>
                                    <div class="qtd-avaliacoes-container">
                                        <h3>Número de avaliações</h3>
                                        <span class="numero-avaliacoes">${animacao.numero_avaliacoes} ${animacao.numero_avaliacoes > 1 ? 'avaliações' : 'avaliação'}</span>
                                    </div>
                                    <div class="qtd-comentarios-container">
                                        <h3>Número de comentários</h3>
                                        <span class="numero-comentarios">${animacao.numero_comentarios} ${animacao.numero_comentarios > 1 ? 'comentários' : 'comentário'}</span>
                                    </div>
                                    <div class="generos-container">
                                        <h3>Gêneros</h3>
                                        <ul id="lista-generos"></ul>
                                    </div>
                                    <div class="classificacao-indicativa-container">
                                        <h3>Classificação indicativa</h3>
                                        <img class="img-classificacao-indicativa" src="../assets/images/classificacao-indicativa/${animacao.classificacao}.png" alt="classificação indicativa">
                                    </div>
                                    <div class="ano-lancamento-container">
                                        <h3>Ano de lançamento</h3>
                                        <span class="ano-lancamento">${animacao.ano_lancamento}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="info-gerais-container">
                                <div class="kpis-animacoes-geral">
                                    <div class="media-geral-container kpi-container">
                                        <h2>Média geral</h2>
                                        <span class="media-geral media-nota kpi">${Number(animacao.media_geral).toFixed(2) * 1} / 5</span>
                                    </div>
                                    <div class="numero-comentarios-geral-container kpi-container">
                                        <h2>Nº total de avaliações</h2>
                                        <span class="numero-avaliacoes-total kpi">${animacao.numero_avaliacoes_total}</span>
                                    </div>
                                </div>
                                <div class="proporcao-avaliacoes-container">
                                    <h2>Proporção em relação ao total de avaliações (%)</h2>
                                    <canvas id="proporcao-avaliacoes"></canvas>
                                </div>
                            </div>
                        </div>
                    `

                    let porcentagemNumeroAvaliacoes = (animacao.numero_avaliacoes / animacao.numero_avaliacoes_total * 100).toFixed(2) * 1
                    let restoPorcentagem = 100 - porcentagemNumeroAvaliacoes

                    let dadosProporcaoAvaliacoes = {
                        labels: [`${animacao.titulo}`, 'Resto'],
                        data: [porcentagemNumeroAvaliacoes, restoPorcentagem]
                    }
                    obterGeneros(animacao.id_animacao)
                    plotarGraficoProporcaoAvaliacoes(dadosProporcaoAvaliacoes)
                })
            } else {
                console.log('Erro na busca de melhor animação');
                throw 'Erro na busca de melhor animação'
            }
        }).catch(resposta => {
            console.log(resposta);
        })
    }

    function plotarGraficoProporcaoAvaliacoes(dados) {
        let data = {
            labels: dados.labels,
            datasets: [{
                label: 'Porcentagem (%)',
                data: dados.data,
                backgroundColor: [
                    '#EAAB39',
                    '#2D61A6',
                ],
            }]
        }

        let config = {
            type: 'pie',
            data
        }

        let myChart = new Chart(
            document.getElementById('proporcao-avaliacoes'),
            config
        );
    }

    function obterGeneros(id_animacao) {
        let ul_lista_generos = document.getElementById('lista-generos')

        fetch(`/generos/buscar/${id_animacao}`)
        .then(function (resposta) {
            if(resposta.ok) {

                if(resposta.status == 204) {
                    ul_lista_generos.innerHTML = '<li><span>Nenhum gênero registrado</span></li>'
                } else {
                    resposta.json().then(array => {

                        array.forEach(genero => {
                            ul_lista_generos.innerHTML += `<li><span>${genero.nome}</span></li>`
                        });
                    })
                }
            }
        }).catch(erro => {
            console.log("Ocorreu um erro ao obter gêneros", erro);
        })
    }
</script>
