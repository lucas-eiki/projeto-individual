<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animotion</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header>
        <img class="logo-animotion" src="./assets/images/animotion-logo.png" alt="logo animotion">

        <nav>
            <ul class="links">
                <li><a href="index.html">Início</a></li>
                <li><a href="index.html#definicao">Definição</a></li>
                <li><a href="index.html#tipos">Tipos</a></li>
                <li><a href="index.html#licoes">Lições</a></li>
                <li><a href="index.html#sobre">Sobre</a></li>
            </ul>
            <div class="header-cta">
                <a href="./login.html">Entrar</a>
                <a href="./cadastro.html" class="cta-button">Cadastre-se</a>
            </div>
        </nav>
    </header>

    <main class="login-container">
        <div class="form-container">
            <h1>Entre na sua conta</h1>
            <div class="inputs-container">
                <input type="text" placeholder="Email" id="ipt_email">
                <div class="senha-container">
                    <input type="password" placeholder="Senha" id="ipt_senha">
                    <a href="#">Esqueci a senha</a>
                </div>
            </div>
            <div class="login-buttons-container">
                <button onclick="entrar()">Entrar</button>
            </div>
        </div>
    </main>

    <footer>
        <img class="logo-animotion" src="./assets/images/animotion-logo.png" alt="logo animotion">
        <p>Feito com carinho por Lucas Eiki Gushiken</p>
        <div class="contatos">
            <h3>Contatos</h3>
            <div class="contatos-container">
                <ul class="redes-sociais">
                    <li><a target="_blank" href="https://www.linkedin.com/in/lucaseikigushiken/"><img
                                src="./assets/images/icons/linkedin-icon.png" alt="logo do linkedin"></a></li>
                    <li><a target="_blank" href="https://github.com/lucas-eiki"><img
                                src="./assets/images/icons/github-icon.png" alt="logo do github"></a></li>
                </ul>
                <div class="email-container">
                    <h4>E-mail:</h4>
                    <p>lucas.gushiken@sptech.school</p>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>

<script>
    function entrar() {
        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
            alert('Preencha todos os campos')
            return false;
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.SOBRENOME_USUARIO = json.sobrenome;
                    sessionStorage.DATA_NASCIMENTO_USUARIO = json.data_nascimento;
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.APELIDO_USUARIO = json.apelido;
                    sessionStorage.IMAGEM_PERFIL_USUARIO = json.imagem_perfil;

                    window.location = "./dashboard/animacoes.html";

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                alert('Email e/ou senha inválido(s)')
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
</script>
