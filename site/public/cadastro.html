<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Animotion</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/styles.css">
    
    <link rel="shortcut icon" href="./assets/images/icons/boneco-icon.png" type="image/x-icon">
</head>

<body>
    <header>
        <img class="logo-animotion" src="./assets/images/animotion-logo.png" alt="logo animotion">

        <nav>
            <ul class="links">
                <li><a href="index.html">Início</a></li>
                <li><a href="index.html#definicao">Definição</a></li>
                <li><a href="index.html#tipos">Tipos</a></li>
                <li><a href="index.html#licoes">Lições</a></li>
                <li><a href="index.html#sobre">Sobre</a></li>
            </ul>
            <div class="header-cta">
                <a href="./login.html">Entrar</a>
                <a href="./cadastro.html" class="cta-button">Cadastre-se</a>
            </div>
        </nav>
    </header>

    <main class="login-container">
        <div class="form-container">
            <h1>Crie sua conta</h1>
            <div class="inputs-container">
                <input type="text" placeholder="Nome" id="ipt_nome">
                <input type="text" placeholder="Sobrenome" id="ipt_sobrenome">
                <input type="text" placeholder="Apelido (opcional)" id="ipt_apelido">
                <input type="text" placeholder="Email" id="ipt_email">
                <input type="password" placeholder="Senha" id="ipt_senha">
                <input type="password" placeholder="Confirme sua senha" id="ipt_senha_confirmacao">
            </div>
            <div class="login-buttons-container">
                <button onclick="cadastrar()">Cadastrar</button>
                <a href="./login.html">Já tem uma conta? Faça seu login!</a>
            </div>
        </div>
    </main>

    <footer>
        <img class="logo-animotion" src="./assets/images/animotion-logo.png" alt="logo animotion">
        <p>Feito com carinho por Lucas Eiki Gushiken</p>
        <div class="contatos">
            <h3>Contatos</h3>
            <div class="contatos-container">
                <ul class="redes-sociais">
                    <li><a target="_blank" href="https://www.linkedin.com/in/lucaseikigushiken/"><img
                                src="./assets/images/icons/linkedin-icon.png" alt="logo do linkedin"></a></li>
                    <li><a target="_blank" href="https://github.com/lucas-eiki"><img
                                src="./assets/images/icons/github-icon.png" alt="logo do github"></a></li>
                </ul>
                <div class="email-container">
                    <h4>E-mail:</h4>
                    <p>lucas.gushiken@sptech.school</p>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>

<script>
    function cadastrar() {
        let nome = ipt_nome.value
        let sobrenome = ipt_sobrenome.value
        let apelido = ipt_apelido.value
        let email = ipt_email.value
        let senha = ipt_senha.value
        let senha_confirmacao = ipt_senha_confirmacao.value

        if (
            nome.trim() == '' ||
            sobrenome.trim() == '' ||
            email.trim() == '' ||
            senha.trim() == '' ||
            senha_confirmacao.trim() == ''
        ) {
            alert('Preencha todos os campos')
        }
        else if (senha != senha_confirmacao) {
            alert('Senhas não correspondem')
        }
        else {

            fetch('/usuarios/cadastrar', {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    nomeServer: nome,
                    sobrenomeServer: sobrenome,
                    emailServer: email,
                    apelidoServer: apelido,
                    senhaServer: senha
                }),
            })
                .then(resposta => {
                    if (resposta.ok) {
                        alert('Cadastro realizado com sucesso')
                        window.location = "login.html";
                    }
                    else {
                        throw "Houve um erro ao tentar realizar o cadastro!";
                    }
                }).catch(erro => {
                    alert(erro)
                    console.log(erro);
                })
        }
    }
</script>
